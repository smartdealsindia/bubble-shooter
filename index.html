
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bubble Shooter Arcade</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;min-height:100vh;font-family:Arial,sans-serif;color:white;
  background:linear-gradient(145deg,#140d38,#25206b 55%,#111936);
  display:flex;justify-content:center;align-items:center;padding:12px;
  overscroll-behavior:none
}
.app{width:100%;max-width:520px;text-align:center}
h1{margin:4px 0 5px;font-size:clamp(25px,7vw,38px);font-weight:900;
  letter-spacing:1px;color:#ffe66d;text-shadow:0 3px #ed5a91,0 0 18px #a34cff}
.subtitle{font-size:12px;color:#c9c7ff;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:#ffffff12;border:1px solid #ffffff25;border-radius:13px;padding:9px 3px}
.stat small{display:block;font-size:10px;color:#c7c8ff;text-transform:uppercase;letter-spacing:1px}
.stat strong{display:block;font-size:21px;margin-top:3px;color:#fff}
.gamebox{position:relative;width:100%;overflow:hidden;border:2px solid #8d7bff;
  border-radius:19px;background:#10183b;box-shadow:0 12px 35px #0005;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;background:#0d1036d9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;z-index:3}
.overlay.hidden{display:none}
.overlay h2{font-size:32px;margin:0 0 10px;color:#ffe66d;text-shadow:0 3px #f04d9c}
.overlay p{font-size:14px;line-height:1.6;color:#e0ddff;margin:0 0 20px}
button{border:0;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:800;
  color:#20104d;background:linear-gradient(135deg,#ffe66d,#ff9fcb);cursor:pointer;
  box-shadow:0 4px 0 #a44b9d;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #a44b9d}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.controls button{font-size:12px;padding:11px 16px}
.tip{font-size:12px;color:#c9c7ff;line-height:1.5;margin:12px 0 2px}
</style>
</head>
<body>
<main class="app">
  <h1>🫧 BUBBLE POP!</h1>
  <div class="subtitle">Aim • Match 3 • Pop your way to victory!</div>

  <div class="stats">
    <div class="stat"><small>Score</small><strong id="score">0</strong></div>
    <div class="stat"><small>Level</small><strong id="level">1</strong></div>
    <div class="stat"><small>Bubbles left</small><strong id="shots">30</strong></div>
  </div>

  <div class="gamebox" id="gamebox">
    <canvas id="game" width="480" height="660"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Bubble Pop!</h2>
      <p id="overlayText">Match 3 or more bubbles of the same color.<br>Clear the board before your shots run out!</p>
      <button id="startBtn">▶ PLAY NOW</button>
    </div>
  </div>

  <div class="controls">
    <button id="soundBtn">🔊 Sound ON</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="restartBtn">↻ Restart</button>
  </div>
  <div class="tip">👆 Touch or drag to aim, then release to shoot.<br>🖥️ On PC, move your mouse and click to fire.</div>
</main>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const R = 17;
const GAP = 2;
const STEP_X = R * 2 + GAP;
const STEP_Y = Math.sqrt(3) * R + 1;
const COLS = 13;
const TOP = 42;
const COLORS = ["#ff4e86","#42d9ff","#ffe45e","#8c69ff","#52f59b","#ff974d"];
const $ = id => document.getElementById(id);

let grid = [];
let particles = [];
let score = 0;
let level = 1;
let shots = 30;
let currentColor = COLORS[0];
let nextColor = COLORS[1];
let running = false;
let paused = false;
let gameEnded = false;
let soundOn = true;
let aimX = W / 2;
let aimY = 220;
let projectile = null;
let shotCount = 0;
let lastTime = 0;
let audioCtx = null;
let animationId = 0;
let floatingTexts = [];
let transitionTimer = 0;

const shooter = {x:W/2, y:H-54};
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rand = arr => arr[Math.floor(Math.random()*arr.length)];

function rowLength(row) { return COLS; }
function offsetX(row) { return (row % 2) ? STEP_X/2 : 0; }
function centerX(col,row) {
  return 12 + R + col * STEP_X + offsetX(row);
}
function centerY(row) { return TOP + R + row * STEP_Y; }

function cellAt(x,y) {
  const row = Math.round((y - TOP - R) / STEP_Y);
  if(row < 0) return {row:0,col:clamp(Math.round((x-12-R)/STEP_X),0,COLS-1)};
  const col = Math.round((x - 12 - R - offsetX(row)) / STEP_X);
  return {row, col:clamp(col,0,COLS-1)};
}
function validCell(row,col) {
  return row >= 0 && row < 30 && col >= 0 && col < COLS;
}
function getNeighbors(row,col) {
  const even = row % 2 === 0;
  const list = [
    [row,col-1],[row,col+1],
    [row-1,col+(even?-1:0)],[row-1,col+(even?0:1)],
    [row+1,col+(even?-1:0)],[row+1,col+(even?0:1)]
  ];
  return list.filter(([r,c])=>validCell(r,c));
}
function getCell(row,col) {
  if(!validCell(row,col)) return null;
  return grid[row]?.[col] || null;
}
function setCell(row,col,value) {
  while(grid.length <= row) grid.push(Array(COLS).fill(null));
  if(validCell(row,col)) grid[row][col] = value;
}
function randomColor() { return rand(COLORS.slice(0,Math.min(COLORS.length,3+Math.floor((level-1)/2)))); }

function initGrid() {
  grid = [];
  const rows = Math.min(5 + level, 9);
  for(let r=0;r<rows;r++){
    const row = Array(COLS).fill(null);
    for(let c=0;c<COLS;c++){
      if(r < rows - 1 || Math.random() > 0.20) row[c] = randomColor();
    }
    grid.push(row);
  }
  // Ensure there are bubbles in the middle of the top row.
  if(!grid[0].some(Boolean)) grid[0][Math.floor(COLS/2)] = randomColor();
}

function resetGame() {
  score = 0; level = 1; shots = 30; shotCount = 0;
  projectile = null; particles = []; floatingTexts = [];
  gameEnded = false; paused = false; running = true;
  initGrid();
  currentColor = randomColor();
  nextColor = randomColor();
  aimX = W/2; aimY = 220;
  $("overlay").classList.add("hidden");
  $("pauseBtn").textContent = "⏸ Pause";
  updateStats();
  playSound("start");
}
function updateStats() {
  $("score").textContent = score.toLocaleString();
  $("level").textContent = level;
  $("shots").textContent = shots;
}
function playSound(type) {
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const sounds = {
      pop:[520,760,0.11], shoot:[250,360,0.07],
      wall:[300,220,0.035], drop:[190,100,0.15],
      start:[420,680,0.16], win:[540,900,0.28],
      lose:[280,90,0.35], click:[360,420,0.04]
    };
    const s = sounds[type] || sounds.pop;
    osc.type = type==="lose" ? "triangle" : "sine";
    osc.frequency.setValueAtTime(s[0],now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40,s[1]),now+s[2]);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.12,now+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+s[2]);
    osc.start(now); osc.stop(now+s[2]+0.02);
  }catch(e){}
}
function addText(x,y,text,color="#fff") {
  floatingTexts.push({x,y,text,color,life:1});
}
function burst(x,y,color,count=9) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, speed=35+Math.random()*150;
    particles.push({
      x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      color,life:0.45+Math.random()*0.4,size:2+Math.random()*4
    });
  }
}
function allBubbles() {
  const result=[];
  for(let r=0;r<grid.length;r++)
    for(let c=0;c<COLS;c++)
      if(grid[r]?.[c]) result.push({row:r,col:c,color:grid[r][c]});
  return result;
}
function countBubbles() { return allBubbles().length; }

function matchGroup(startRow,startCol,color) {
  const queue=[[startRow,startCol]], seen=new Set(), result=[];
  while(queue.length){
    const [r,c]=queue.shift(), key=r+","+c;
    if(seen.has(key)) continue;
    seen.add(key);
    if(getCell(r,c)!==color) continue;
    result.push([r,c]);
    for(const n of getNeighbors(r,c)) queue.push(n);
  }
  return result;
}
function findFloating() {
  const anchored=new Set(), queue=[];
  for(let c=0;c<COLS;c++) if(getCell(0,c)) queue.push([0,c]);
  while(queue.length){
    const [r,c]=queue.shift(), key=r+","+c;
    if(anchored.has(key) || !getCell(r,c)) continue;
    anchored.add(key);
    for(const n of getNeighbors(r,c)) queue.push(n);
  }
  const falling=[];
  for(let r=0;r<grid.length;r++){
    for(let c=0;c<COLS;c++){
      if(getCell(r,c) && !anchored.has(r+","+c)){
        falling.push({row:r,col:c,color:getCell(r,c)});
        grid[r][c]=null;
      }
    }
  }
  return falling;
}
function removeMatches(row,col) {
  const color=getCell(row,col);
  if(!color) return 0;
  const group=matchGroup(row,col,color);
  if(group.length<3) return 0;
  for(const [r,c] of group){
    const x=centerX(c,r), y=centerY(r);
    burst(x,y,color,7);
    grid[r][c]=null;
  }
  const base=group.length*10;
  score+=base;
  addText(W/2, H*0.45, "+"+base, "#ffe66d");
  playSound("pop");
  const floating=findFloating();
  if(floating.length){
    score+=floating.length*20;
    addText(W/2,H*0.52,"+"+(floating.length*20)+" DROP BONUS","#78f7ff");
    for(const b of floating){
      burst(centerX(b.col,b.row),centerY(b.row),b.color,5);
    }
    playSound("drop");
  }
  updateStats();
  return group.length;
}
function chooseOpenColumn(row,x) {
  let best=0, dist=Infinity;
  for(let c=0;c<COLS;c++){
    if(!getCell(row,c)){
      const d=Math.abs(centerX(c,row)-x);
      if(d<dist){dist=d;best=c;}
    }
  }
  return best;
}
function attachBubble(x,y,color) {
  let cell=cellAt(x,y);
  let row=clamp(cell.row,0,grid.length);
  let col=clamp(cell.col,0,COLS-1);

  // Choose the nearest empty location around the collision point.
  let candidates=[];
  for(let rr=Math.max(0,row-1);rr<=Math.min(29,row+1);rr++){
    for(let cc=0;cc<COLS;cc++){
      if(!getCell(rr,cc)){
        const dx=centerX(cc,rr)-x, dy=centerY(rr)-y;
        candidates.push({row:rr,col:cc,d:dx*dx+dy*dy});
      }
    }
  }
  if(candidates.length){
    candidates.sort((a,b)=>a.d-b.d);
    row=candidates[0].row; col=candidates[0].col;
  }else{
    row=Math.min(29,grid.length); col=chooseOpenColumn(row,x);
  }
  setCell(row,col,color);
  const popped=removeMatches(row,col);
  if(!popped){
    shotCount++;
    if(shotCount>=6){
      addNewRow();
      shotCount=0;
    }
  }
  currentColor=nextColor;
  nextColor=randomColor();
  if(countBubbles()===0){
    levelComplete();
    return;
  }
  if(shots<=0 || allBubbles().some(b=>centerY(b.row)+R>=shooter.y-12)){
    endGame(false);
    return;
  }
  updateStats();
}
function addNewRow() {
  // Move existing bubbles down by one row.
  grid.unshift(Array(COLS).fill(null));
  for(let r=0;r<grid.length;r++) if(!grid[r]) grid[r]=Array(COLS).fill(null);
  grid.pop();
  const colors=COLORS.slice(0,Math.min(COLORS.length,3+Math.floor((level-1)/2)));
  for(let c=0;c<COLS;c++) grid[0][c]=Math.random()<0.9?rand(colors):null;
  for(let c=0;c<COLS;c++){
    if(centerY(grid.length-1)+R>=shooter.y-12) break;
  }
  addText(W/2,TOP+25,"NEW ROW!","#ff91cf");
}
function shoot() {
  if(!running || paused || gameEnded || projectile || transitionTimer>0) return;
  const dx=aimX-shooter.x, dy=aimY-shooter.y;
  let angle=Math.atan2(dy,dx);
  angle=clamp(angle,-Math.PI+0.2,-0.2);
  const speed=600;
  projectile={x:shooter.x,y:shooter.y-12,vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,color:currentColor};
  shots--;
  updateStats();
  playSound("shoot");
}
function updateProjectile(dt) {
  if(!projectile) return;
  const p=projectile;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.x<R+2){p.x=R+2;p.vx=Math.abs(p.vx);playSound("wall");}
  if(p.x>W-R-2){p.x=W-R-2;p.vx=-Math.abs(p.vx);playSound("wall");}
  if(p.y<=TOP+R){
    attachBubble(p.x,TOP+R,p.color); projectile=null; return;
  }
  for(const b of allBubbles()){
    const bx=centerX(b.col,b.row), by=centerY(b.row);
    const dx=p.x-bx,dy=p.y-by;
    if(dx*dx+dy*dy < (R*2-1)*(R*2-1)){
      attachBubble(p.x,p.y,p.color); projectile=null; return;
    }
  }
}
function levelComplete() {
  running=false; gameEnded=true; transitionTimer=0;
  playSound("win");
  $("overlayTitle").textContent="🎉 Level Complete!";
  $("overlayText").innerHTML="Amazing shooting!<br>Your score: <b>"+score.toLocaleString()+"</b><br>Ready for the next challenge?";
  $("startBtn").textContent="NEXT LEVEL ▶";
  $("overlay").classList.remove("hidden");
  $("startBtn").onclick=nextLevel;
}
function nextLevel() {
  level++;
  shots=30+Math.min(10,(level-1)*2);
  shotCount=0; projectile=null; particles=[]; floatingTexts=[];
  initGrid();
  currentColor=randomColor(); nextColor=randomColor();
  running=true; paused=false; gameEnded=false;
  $("overlay").classList.add("hidden");
  $("pauseBtn").textContent="⏸ Pause";
  $("startBtn").onclick=resetGame;
  updateStats(); playSound("start");
}
function endGame(won) {
  running=false; gameEnded=true; projectile=null;
  playSound(won?"win":"lose");
  $("overlayTitle").textContent=won?"🏆 You Win!":"💥 Game Over";
  $("overlayText").innerHTML=won
    ?"You cleared the board!<br>Final score: <b>"+score.toLocaleString()+"</b>"
    :"No more shots!<br>Final score: <b>"+score.toLocaleString()+"</b><br>Give it another try!";
  $("startBtn").textContent="↻ PLAY AGAIN";
  $("overlay").classList.remove("hidden");
  $("startBtn").onclick=resetGame;
}
function drawBubble(x,y,color,r=R) {
  const grad=ctx.createRadialGradient(x-r*.35,y-r*.45,2,x,y,r*1.2);
  grad.addColorStop(0,"#ffffff");
  grad.addColorStop(.16,color);
  grad.addColorStop(1,shadeColor(color,-35));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle="#ffffff55";ctx.stroke();
  ctx.beginPath();ctx.ellipse(x-r*.27,y-r*.35,r*.27,r*.15,-.5,0,Math.PI*2);
  ctx.fillStyle="#ffffff99";ctx.fill();
}
function shadeColor(hex,percent) {
  const num=parseInt(hex.slice(1),16);
  const amt=Math.round(2.55*percent);
  const Rr=clamp((num>>16)+amt,0,255);
  const Gg=clamp(((num>>8)&255)+amt,0,255);
  const Bb=clamp((num&255)+amt,0,255);
  return "#"+(0x1000000+Rr*0x10000+Gg*0x100+Bb).toString(16).slice(1);
}
function drawBackground() {
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#17224e");grad.addColorStop(1,"#10142e");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  for(let i=0;i<48;i++){
    const x=(i*83+19)%W, y=(i*137+25)%H;
    ctx.globalAlpha=.18+(i%4)*.12;
    ctx.fillStyle="#ffffff";ctx.beginPath();ctx.arc(x,y,i%3===0?1.7:1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function draw() {
  drawBackground();
  // Top guide line
  ctx.setLineDash([5,7]);ctx.strokeStyle="#ffffff22";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,TOP-5);ctx.lineTo(W,TOP-5);ctx.stroke();ctx.setLineDash([]);

  for(let r=0;r<grid.length;r++){
    for(let c=0;c<COLS;c++){
      const color=getCell(r,c);
      if(color) drawBubble(centerX(c,r),centerY(r),color);
    }
  }

  // Aiming guide
  if(running&&!paused&&!projectile&&!gameEnded){
    let dx=aimX-shooter.x,dy=aimY-shooter.y;
    let angle=Math.atan2(dy,dx);
    angle=clamp(angle,-Math.PI+0.2,-0.2);
    let vx=Math.cos(angle),vy=Math.sin(angle);
    let x=shooter.x,y=shooter.y-12;
    ctx.fillStyle="#ffffff88";
    for(let i=0;i<18;i++){
      x+=vx*13;y+=vy*13;
      if(x<R||x>W-R){vx=-vx;x=clamp(x,R,W-R);}
      if(y<TOP+R)break;
      ctx.beginPath();ctx.arc(x,y,2.3,0,Math.PI*2);ctx.fill();
    }
  }

  // Launcher base
  ctx.save();
  ctx.translate(shooter.x,shooter.y);
  let angle=Math.atan2(aimY-shooter.y,aimX-shooter.x);
  angle=clamp(angle,-Math.PI+0.2,-0.2);
  ctx.rotate(angle);
  ctx.fillStyle="#8e8bff";
  ctx.beginPath();ctx.roundRect(-3,-12,40,24,10);ctx.fill();
  ctx.fillStyle="#d7d6ff";
  ctx.beginPath();ctx.roundRect(3,-7,31,14,7);ctx.fill();
  ctx.restore();
  drawBubble(shooter.x,shooter.y,currentColor,R+1);

  // Next bubble preview
  ctx.fillStyle="#ffffffaa";ctx.font="bold 11px Arial";ctx.textAlign="center";
  ctx.fillText("NEXT",W-48,H-79);
  drawBubble(W-48,H-48,nextColor,12);

  if(projectile) drawBubble(projectile.x,projectile.y,projectile.color,R);
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life*2,0,1);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const t of floatingTexts){
    ctx.globalAlpha=clamp(t.life,0,1);ctx.fillStyle=t.color;
    ctx.font="900 21px Arial";ctx.textAlign="center";
    ctx.shadowColor="#000";ctx.shadowBlur=5;ctx.fillText(t.text,t.x,t.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  if(paused){
    ctx.fillStyle="#080b26bb";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffe66d";ctx.font="900 38px Arial";ctx.textAlign="center";
    ctx.fillText("PAUSED",W/2,H/2);
    ctx.fillStyle="#ffffff";ctx.font="16px Arial";
    ctx.fillText("Tap Resume to continue",W/2,H/2+30);
  }
}
function update(dt) {
  if(!running||paused||gameEnded) return;
  updateProjectile(dt);
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
  for(const t of floatingTexts){t.y-=28*dt;t.life-=dt;}
  floatingTexts=floatingTexts.filter(t=>t.life>0);
}
function frame(time) {
  const dt=Math.min((time-lastTime)/1000||0,0.035);
  lastTime=time;
  update(dt);draw();
  animationId=requestAnimationFrame(frame);
}

function pointerPosition(e) {
  const rect=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-rect.left)*W/rect.width,
    y:(e.clientY-rect.top)*H/rect.height
  };
}
let pointerDown=false;
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(!running||paused||gameEnded)return;
  pointerDown=true;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  const p=pointerPosition(e);aimX=p.x;aimY=Math.min(p.y,shooter.y-20);
});
canvas.addEventListener("pointermove",e=>{
  if(!pointerDown&&!e.pointerType.includes("mouse"))return;
  if(!running||paused)return;
  const p=pointerPosition(e);
  aimX=p.x;aimY=Math.min(p.y,shooter.y-20);
});
canvas.addEventListener("pointerup",e=>{
  if(!pointerDown)return;
  pointerDown=false;
  if(!running||paused||gameEnded)return;
  const p=pointerPosition(e);
  aimX=p.x;aimY=Math.min(p.y,shooter.y-20);
  shoot();
});
canvas.addEventListener("pointercancel",()=>pointerDown=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

$("startBtn").onclick=resetGame;
$("restartBtn").onclick=()=>{
  $("startBtn").onclick=resetGame;
  resetGame();
};
$("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  $("soundBtn").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";
  if(soundOn)playSound("click");
};
$("pauseBtn").onclick=()=>{
  if(!running||gameEnded)return;
  paused=!paused;
  $("pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause";
  if(!paused)playSound("click");
};

window.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){
    e.preventDefault();shoot();
  }
  if(e.code==="ArrowLeft")aimX=Math.max(R,aimX-22);
  if(e.code==="ArrowRight")aimX=Math.min(W-R,aimX+22);
  if(e.code==="Escape"&&running){
    paused=!paused;
    $("pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause";
  }
});
