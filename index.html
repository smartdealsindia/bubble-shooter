<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bubble Pop Shooter</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:linear-gradient(145deg,#17113e,#302276,#101b40);
font-family:Arial,sans-serif;color:white;text-align:center;min-height:100vh}
.app{width:100%;max-width:500px;margin:auto}
h1{margin:6px 0;color:#ffe66d;font-size:clamp(27px,7vw,38px);text-shadow:0 3px #ed4c9a}
.sub{font-size:12px;color:#d9d5ff;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:#ffffff13;border:1px solid #ffffff30;border-radius:12px;padding:9px 3px}
.stat small{display:block;color:#c9c5ff;font-size:10px;text-transform:uppercase}
.stat b{font-size:21px;display:block;margin-top:4px}
.game{position:relative;border:2px solid #a99bff;border-radius:17px;overflow:hidden;background:#10183b;touch-action:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;background:#0b0d32df;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.overlay.hide{display:none}
.overlay h2{font-size:32px;color:#ffe66d;margin:0 0 12px}
.overlay p{line-height:1.6;font-size:14px;color:#e5e1ff}
button{border:0;border-radius:30px;padding:12px 17px;font-weight:bold;background:linear-gradient(135deg,#ffe66d,#ff91cb);color:#211047;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.controls button{font-size:12px}
.tip{font-size:12px;color:#d4d0ff;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="app">
  <h1>🫧 BUBBLE POP!</h1>
  <div class="sub">Aim • Match 3 • Pop the bubbles!</div>

  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Level</small><b id="level">1</b></div>
    <div class="stat"><small>Shots left</small><b id="shots">35</b></div>
  </div>

  <div class="game">
    <canvas id="canvas" width="480" height="660"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Bubble Pop!</h2>
      <p id="message">Match 3 or more bubbles of the same color.<br>Clear all bubbles to win!</p>
      <button id="start">▶ START GAME</button>
    </div>
  </div>

  <div class="controls">
    <button id="sound">🔊 Sound ON</button>
    <button id="pause">⏸ Pause</button>
    <button id="restart">↻ Restart</button>
  </div>
  <div class="tip">📱 Touch and release to shoot<br>🖱️ Move mouse to aim and click to shoot</div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = 480, H = 660;
const R = 16;
const DX = 34;
const DY = 29.45;
const LEFT = 18;
const TOP = 39;
const COLS = 13;
const ROWS = 18;
const COLORS = ["#ff4c88","#38d9ff","#ffe34f","#9b70ff","#54ed9b","#ff984c"];

const $ = id => document.getElementById(id);
let grid, score, level, shots, shotCount;
let currentColor, nextColor, projectile;
let running = false, paused = false, ended = false;
let soundOn = true, audio = null;
let aimX = W/2, aimY = 230;
let pointerDown = false;
let particles = [], texts = [];
let animationTime = 0;

const shooter = {x:W/2,y:603};

function randColor(){
  const available = Math.min(COLORS.length,3+Math.floor((level-1)/2));
  return COLORS[Math.floor(Math.random()*available)];
}
function cx(c,r){return LEFT+R+c*DX+(r%2?DX/2:0);}
function cy(r){return TOP+R+r*DY;}
function inside(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS;}
function bubble(r,c){return inside(r,c)?grid[r][c]:null;}

function neighbors(r,c){
  const d = r%2===0 ? -1 : 0;
  return [
    [r,c-1],[r,c+1],
    [r-1,c+d],[r-1,c+d+1],
    [r+1,c+d],[r+1,c+d+1]
  ].filter(([rr,cc])=>inside(rr,cc));
}

function play(type="pop"){
  if(!soundOn)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended")audio.resume();
    const presets={
      pop:[550,850,.09],shoot:[280,420,.07],wall:[350,250,.04],
      drop:[220,100,.15],win:[500,950,.25],lose:[260,80,.3]
    };
    const [a,b,duration]=presets[type]||presets.pop;
    const osc=audio.createOscillator(),gain=audio.createGain();
    osc.connect(gain);gain.connect(audio.destination);
    osc.frequency.setValueAtTime(a,audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(b,audio.currentTime+duration);
    gain.gain.setValueAtTime(.10,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    osc.start();osc.stop(audio.currentTime+duration);
  }catch(e){}
}

function makeGrid(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const rows=Math.min(5+level,9);
  for(let r=0;r<rows;r++){
    for(let c=0;c<COLS;c++){
      if(r<rows-1||Math.random()>.12)grid[r][c]=randColor();
    }
  }
}

function reset(){
  score=0;level=1;shots=35;shotCount=0;
  particles=[];texts=[];projectile=null;
  running=true;paused=false;ended=false;
  currentColor=randColor();nextColor=randColor();
  aimX=W/2;aimY=230;
  makeGrid();
  $("overlay").classList.add("hide");
  $("pause").textContent="⏸ Pause";
  updateStats();
}
function updateStats(){
  $("score").textContent=score.toLocaleString();
  $("level").textContent=level;
  $("shots").textContent=shots;
}
function showOverlay(title,message,buttonText,action){
  $("title").textContent=title;
  $("message").innerHTML=message;
  $("start").textContent=buttonText;
  $("start").onclick=action;
  $("overlay").classList.remove("hide");
}
function startNextLevel(){
  level++;
  shots=35+Math.min(15,(level-1)*2);
  shotCount=0;projectile=null;particles=[];texts=[];
  currentColor=randColor();nextColor=randColor();
  makeGrid();
  running=true;paused=false;ended=false;
  $("overlay").classList.add("hide");
  $("pause").textContent="⏸ Pause";
  updateStats();
}

function popParticles(x,y,color,n=9){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=35+Math.random()*130;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      life:.45+Math.random()*.35,color,size:2+Math.random()*3});
  }
}
function addText(x,y,text,color="#fff"){
  texts.push({x,y,text,color,life:1});
}
function groupAt(sr,sc,color){
  const todo=[[sr,sc]],seen=new Set(),group=[];
  while(todo.length){
    const [r,c]=todo.pop(),key=r+","+c;
    if(seen.has(key))continue;
    seen.add(key);
    if(bubble(r,c)!==color)continue;
    group.push([r,c]);
    neighbors(r,c).forEach(n=>todo.push(n));
  }
  return group;
}
function dropUnconnected(){
  const seen=new Set(),todo=[];
  for(let c=0;c<COLS;c++)if(bubble(0,c))todo.push([0,c]);
  while(todo.length){
    const [r,c]=todo.pop(),key=r+","+c;
    if(seen.has(key)||!bubble(r,c))continue;
    seen.add(key);
    neighbors(r,c).forEach(n=>todo.push(n));
  }
  let count=0;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(grid[r][c]&&!seen.has(r+","+c)){
        popParticles(cx(c,r),cy(r),grid[r][c],5);
        grid[r][c]=null;count++;
      }
    }
  }
  if(count){
    score+=count*20;
    addText(W/2,H*.50,"+"+count*20+" DROP BONUS","#58f3ff");
    play("drop");
  }
}

function attach(x,y,color,hitRow=-1,hitCol=-1){
  let candidates=[];
  if(hitRow>=0){
    for(const [r,c] of neighbors(hitRow,hitCol)){
      if(!bubble(r,c)){
        const dx=cx(c,r)-x,dy=cy(r)-y;
        candidates.push({r,c,d:dx*dx+dy*dy});
      }
    }
  }
  if(y<=cy(0)+R){
    for(let c=0;c<COLS;c++){
      if(!bubble(0,c)){
        const dx=cx(c,0)-x;
        candidates.push({r:0,c,d:dx*dx});
      }
    }
  }
  // If a collision had no nearby empty slot, search the closest available cell.
  if(!candidates.length){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(!bubble(r,c)){
        const dx=cx(c,r)-x,dy=cy(r)-y;
        candidates.push({r,c,d:dx*dx+dy*dy});
      }
    }
  }
  if(!candidates.length){finish(false);return;}
  candidates.sort((a,b)=>a.d-b.d);
  const {r,c}=candidates[0];
  grid[r][c]=color;

  const group=groupAt(r,c,color);
  if(group.length>=3){
    group.forEach(([rr,cc])=>{
      popParticles(cx(cc,rr),cy(rr),grid[rr][cc]);
      grid[rr][cc]=null;
    });
    const points=group.length*10;
    score+=points;
    addText(W/2,H*.44,"+"+points,"#ffe66d");
    play("pop");
    dropUnconnected();
  }else{
    shotCount++;
    if(shotCount>=6){
      shotCount=0;
      addNewRow();
      if(ended)return;
    }
  }

  currentColor=nextColor;
  nextColor=randColor();

  updateStats();
  if(countBubbles()===0){
    running=false;ended=true;play("win");
    showOverlay("🏆 Level Complete!","Fantastic! Your score is <b>"+score+"</b>.","NEXT LEVEL ▶",startNextLevel);
    return;
  }
  if(shots<=0||reachedBottom())finish(false);
}
function countBubbles(){
  let n=0;for(const row of grid)for(const b of row)if(b)n++;
  return n;
}
function reachedBottom(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(bubble(r,c)&&cy(r)+R>=shooter.y-35)return true;
  }
  return false;
}
function addNewRow(){
  if(grid[ROWS-1].some(Boolean)){
    finish(false);return;
  }
  for(let r=ROWS-1;r>0;r--)grid[r]=grid[r-1].slice();
  grid[0]=Array(COLS).fill(null);
  for(let c=0;c<COLS;c++)grid[0][c]=Math.random()<.88?randColor():null;
  addText(W/2,TOP+20,"NEW ROW!","#ff8dc8");
}
function finish(won){
  if(ended)return;
  running=false;ended=true;projectile=null;
  play(won?"win":"lose");
  showOverlay(won?"🏆 You Win!":"💥 Game Over",
    won?"You cleared the board!<br>Score: <b>"+score+"</b>":
    "No more shots or bubbles got too low.<br>Final score: <b>"+score+"</b>",
    "↻ PLAY AGAIN",reset);
}

function shoot(){
  if(!running||paused||ended||projectile)return;
  let angle=Math.atan2(aimY-shooter.y,aimX-shooter.x);
  angle=Math.max(-Math.PI+.15,Math.min(-.15,angle));
  const speed=650;
  projectile={x:shooter.x,y:shooter.y-18,
    vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color:currentColor};
  shots--;
  updateStats();play("shoot");
}

function update(dt){
  if(!running||paused||ended)return;

  if(projectile){
    const p=projectile;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.x<=R){p.x=R;p.vx=Math.abs(p.vx);play("wall");}
    if(p.x>=W-R){p.x=W-R;p.vx=-Math.abs(p.vx);play("wall");}

    let hit=null;
    if(p.y<=cy(0)){
      attach(p.x,p.y,p.color);
      projectile=null;
    }else{
      outer:
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          if(!bubble(r,c))continue;
          const dx=p.x-cx(c,r),dy=p.y-cy(r);
          if(dx*dx+dy*dy<=(R*2-1)*(R*2-1)){
            hit={r,c};break outer;
          }
        }
      }
      if(hit){
        attach(p.x,p.y,p.color,hit.r,hit.c);
        projectile=null;
      }
    }
  }

  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
  for(const t of texts){t.y-=25*dt;t.life-=dt;}
  texts=texts.filter(t=>t.life>0);
}

function bubbleDraw(x,y,color,r=R){
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,1,x,y,r*1.25);
  g.addColorStop(0,"#ffffff");
  g.addColorStop(.17,color);
  g.addColorStop(1,darken(color));
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle="#ffffff77";ctx.lineWidth=1.3;ctx.stroke();
  ctx.beginPath();ctx.ellipse(x-r*.28,y-r*.34,r*.25,r*.13,-.5,0,Math.PI*2);
  ctx.fillStyle="#ffffffaa";ctx.fill();
}
function darken(hex){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,(n>>16)-45),g=Math.max(0,((n>>8)&255)-45),b=Math.max(0,(n&255)-45);
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#172451");bg.addColorStop(1,"#10142d");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  for(let i=0;i<50;i++){
    ctx.globalAlpha=.15+(i%3)*.1;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc((i*89+17)%W,(i*131+21)%H,i%4===0?2:1,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.setLineDash([5,7]);ctx.strokeStyle="#ffffff25";
  ctx.beginPath();ctx.moveTo(0,TOP-5);ctx.lineTo(W,TOP-5);ctx.stroke();ctx.setLineDash([]);

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(bubble(r,c))bubbleDraw(cx(c,r),cy(r),bubble(r,c));
  }

  // Dotted aiming guide
  if(running&&!paused&&!projectile&&!ended){
    let a=Math.atan2(aimY-shooter.y,aimX-shooter.x);
    a=Math.max(-Math.PI+.15,Math.min(-.15,a));
    let x=shooter.x,y=shooter.y-18,vx=Math.cos(a),vy=Math.sin(a);
    ctx.fillStyle="#ffffff88";
    for(let i=0;i<28;i++){
      x+=vx*11;y+=vy*11;
      if(x<R){x=R;vx=Math.abs(vx);}
      if(x>W-R){x=W-R;vx=-Math.abs(vx);}
      if(y<TOP+R)break;
      ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
    }
  }

  // Launcher
  ctx.save();
  ctx.translate(shooter.x,shooter.y);
  let a=Math.atan2(aimY-shooter.y,aimX-shooter.x);
  a=Math.max(-Math.PI+.15,Math.min(-.15,a));
  ctx.rotate(a);
  ctx.fillStyle="#9c91ff";
  ctx.beginPath();ctx.roundRect(-2,-10,40,20,9);ctx.fill();
  ctx.fillStyle="#e5e0ff";
  ctx.beginPath();ctx.roundRect(7,-5,29,10,5);ctx.fill();
  ctx.restore();
  bubbleDraw(shooter.x,shooter.y,currentColor,R+1);

  ctx.textAlign="center";ctx.font="bold 11px Arial";ctx.fillStyle="#ffffffbb";
  ctx.fillText("NEXT",W-47,H-78);
  bubbleDraw(W-47,H-48,nextColor,12);

  if(projectile)bubbleDraw(projectile.x,projectile.y,projectile.color);
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const t of texts){
    ctx.globalAlpha=Math.max(0,t.life);ctx.fillStyle=t.color;
    ctx.font="900 20px Arial";ctx.textAlign="center";ctx.fillText(t.text,t.x,t.y);
  }
  ctx.globalAlpha=1;

  if(paused){
    ctx.fillStyle="#070a28cc";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffe66d";ctx.font="900 38px Arial";ctx.textAlign="center";
    ctx.fillText("PAUSED",W/2,H/2);
  }
}

function frame(t){
  const dt=Math.min((t-animationTime)/1000||0,.03);
  animationTime=t;
  update(dt);draw();
  requestAnimationFrame(frame);
}

function position(e){
  const rect=canvas.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*W/rect.width,
          y:(e.clientY-rect.top)*H/rect.height};
}
canvas.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if(!running||paused||ended)return;
  pointerDown=true;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  const p=position(e);aimX=p.x;aimY=Math.min(p.y,shooter.y-30);
});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse"&&!pointerDown)return;
  if(!running||paused)return;
  const p=position(e);aimX=p.x;aimY=Math.min(p.y,shooter.y-30);
});
canvas.addEventListener("pointerup",e=>{
  if(!pointerDown)return;
  pointerDown=false;
  if(!running||paused||ended)return;
  const p=position(e);aimX=p.x;aimY=Math.min(p.y,shooter.y-30);
  shoot();
});
canvas.addEventListener("pointercancel",()=>pointerDown=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());

$("start").onclick=reset;
$("restart").onclick=reset;
$("sound").onclick=()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";
  if(soundOn)play("pop");
};
$("pause").onclick=()=>{
  if(!running||ended)return;
  paused=!paused;
  $("pause").textContent=paused?"▶ Resume":"⏸ Pause";
};

// Keyboard controls
window.addEventListener("keydown",e=>{
  if(e.code==="ArrowLeft")aimX=Math.max(R,aimX-20);
  if(e.code==="ArrowRight")aimX=Math.min(W-R,aimX+20);
  if(e.code==="Space"){
    e.preventDefault();shoot();
  }
  if(e.code==="Escape"&&running){
    paused=!paused;
    $("pause").textContent=paused?"▶ Resume":"⏸ Pause";
  }
});

makeGrid();
currentColor=randColor();nextColor=randColor();
score=0;level=1;shots=35;
updateStats();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
